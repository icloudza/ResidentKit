# Nginx 反代示例：HTTPS 由 Nginx 负责（证书用 certbot 申请），rk-server 只监听本机 8765。
# 设备地址 wss://rk.example.com/rk，开放 API https://rk.example.com/open/v1，控制台 https://rk.example.com。

server {
    listen 443 ssl;
    http2 on;
    server_name rk.example.com;

    ssl_certificate     /etc/letsencrypt/live/rk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rk.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;      # 设备真实 IP（连接数限制、封禁按它算）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;                      # 长连接：设备每 25 秒心跳
        proxy_send_timeout 300s;
        proxy_buffering off;                          # OTA 下载、同步调用直接透传
    }
}

# 放在 http {} 里（很多发行版的默认配置已有）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
